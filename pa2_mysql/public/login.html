<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inversiones Coquito — Acceso</title>
<style>
  :root{
    --brand:#1F5C4A; --brand-ink:#0F3F31; --accent:#E8A33D; --bg:#F7F8F2;
    --surface:#FFFFFF; --text:#20261F; --text-2:#5B6459; --border:rgba(31,92,74,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;}
  .wrap{width:100%; max-width:920px; display:grid; grid-template-columns:1fr 1fr; gap:0; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(15,63,49,0.12);}
  @media (max-width:720px){.wrap{grid-template-columns:1fr;}}
  .side{background:var(--brand); color:#fff; padding:32px; display:flex; flex-direction:column; justify-content:center;}
  .side h1{font-size:22px; margin:0 0 8px;}
  .side p{font-size:13.5px; opacity:.9; line-height:1.5;}
  .panel{padding:32px;}
  .tabs{display:flex; gap:6px; margin-bottom:18px; background:#eef1ec; border-radius:10px; padding:4px;}
  .tab{flex:1; text-align:center; padding:8px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; color:var(--text-2);}
  .tab.active{background:var(--surface); color:var(--brand-ink); box-shadow:0 1px 3px rgba(0,0,0,.08);}
  form{display:none; flex-direction:column; gap:10px;}
  form.active{display:flex;}
  label{font-size:12px; font-weight:600; color:var(--text-2);}
  input, select{padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:13.5px;}
  button{margin-top:8px; background:var(--brand); color:#fff; border:none; padding:11px; border-radius:9px; font-weight:700; cursor:pointer; font-size:14px;}
  button:hover{filter:brightness(1.08);}
  .msg{margin-top:12px; padding:10px 12px; border-radius:8px; font-size:13px; display:none;}
  .msg.ok{background:#e4eee8; color:#0F3F31; display:block;}
  .msg.err{background:#fbe7e4; color:#8a2c1f; display:block;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <h1>Inversiones Coquito</h1>
    <p>Portal interno — módulo de Autenticación y Roles. Regístrate o inicia sesión para acceder a Inventario, Ventas (POS), Pedidos Web y Reportes según tu perfil.</p>
  </div>
  <div class="panel">
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="showForm('login')">Iniciar sesión</div>
      <div class="tab" id="tabRegister" onclick="showForm('register')">Crear cuenta</div>
    </div>

    <form id="formLogin" class="active">
      <label for="loginEmail">Correo</label>
      <input id="loginEmail" type="email" required>
      <label for="loginPassword">Contraseña</label>
      <input id="loginPassword" type="password" required>
      <button type="submit">Ingresar</button>
    </form>

    <form id="formRegister">
      <div class="row2">
        <div><label for="regNombres">Nombres</label><input id="regNombres" required></div>
        <div><label for="regApellidos">Apellidos</label><input id="regApellidos" required></div>
      </div>
      <label for="regEmail">Correo</label>
      <input id="regEmail" type="email" required>
      <label for="regPassword">Contraseña</label>
      <input id="regPassword" type="password" minlength="6" required>
      <label for="regRol">Perfil</label>
      <select id="regRol">
        <option value="cajero">Cajero</option>
        <option value="admin_abarrotes">Administrador de Abarrotes</option>
        <option value="admin_confiteria">Administrador de Confitería</option>
        <option value="gerente">Gerente General</option>
        <option value="cliente">Cliente (catálogo web)</option>
      </select>
      <button type="submit">Crear cuenta</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
function showForm(which){
  document.getElementById('formLogin').classList.toggle('active', which==='login');
  document.getElementById('formRegister').classList.toggle('active', which==='register');
  document.getElementById('tabLogin').classList.toggle('active', which==='login');
  document.getElementById('tabRegister').classList.toggle('active', which==='register');
  document.getElementById('msg').className = 'msg';
}
function showMsg(text, ok){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

document.getElementById('formRegister').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    nombres: document.getElementById('regNombres').value,
    apellidos: document.getElementById('regApellidos').value,
    email: document.getElementById('regEmail').value,
    password: document.getElementById('regPassword').value,
    rol: document.getElementById('regRol').value,
  };
  const r = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const data = await r.json();
  if (data.ok) {
    showMsg('Cuenta creada en la base de datos: ' + data.usuario.nombres + ' ' + data.usuario.apellidos + ' (id_usuario ' + data.usuario.id_usuario + ', rol ' + data.usuario.rol + ').', true);
    document.getElementById('formRegister').reset();
  } else {
    showMsg(data.error || 'No se pudo registrar.', false);
  }
});

document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    email: document.getElementById('loginEmail').value,
    password: document.getElementById('loginPassword').value,
  };
  const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const data = await r.json();
  if (data.ok) {
    showMsg('Bienvenido/a ' + data.usuario.nombres + ' — sesión válida como ' + data.usuario.rol + '.', true);
  } else {
    showMsg(data.error || 'No se pudo iniciar sesión.', false);
  }
});
</script>
</body>
</html>
